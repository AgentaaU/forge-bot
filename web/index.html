<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>forge-bot</title>
<link rel="stylesheet" href="/dashboard.css">
<style>
main { max-width: 60rem; margin: auto; padding: clamp(1rem, 5vw, 4rem) 1rem; }
header {
  padding: clamp(1.25rem, 4vw, 3rem);
  color: #eff8f2;
  background: #193e36;
  border-radius: 1.25rem;
}
h1 { margin: 0; font-size: clamp(2.5rem, 7vw, 4.75rem); letter-spacing: -.055em; line-height: 1.1; }
dl {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 9rem), 1fr));
  gap: 1.25rem;
  margin: 2rem 0 0;
  border-top: 1px solid #527069;
  padding-top: 1.25rem;
}
dt { color: #bed5cb; font-size: .85rem; }
dd { margin: .25rem 0 0; overflow-wrap: anywhere; }
h2 { margin: 2rem 0 .75rem; font-size: 1.45rem; }
ul { margin: 0; padding: 0; list-style: none; border: 1px solid #cdd8cf; border-radius: 1rem; background: white; }
li + li { border-top: 1px solid #dce3dc; }
a {
  display: grid;
  grid-template-columns: minmax(9rem, 1fr) 3fr auto;
  gap: 1rem;
  align-items: baseline;
  padding: 1.1rem clamp(1rem, 3vw, 2rem);
  color: #245d4f;
  text-decoration: none;
}
li:first-child a { border-radius: 1rem 1rem 0 0; }
li:last-child a { border-radius: 0 0 1rem 1rem; }
a:hover, a:focus-visible { background: #edf5ee; }
a:focus-visible { outline: 3px solid #29725a; outline-offset: -3px; }
a code { font-weight: bold; }
a span { color: #465951; }
@media (max-width: 36rem) {
  a { grid-template-columns: 1fr auto; gap: .2rem .75rem; }
  a span { grid-column: 1; grid-row: 2; }
  a b { grid-column: 2; grid-row: 1 / 3; align-self: center; }
}
</style>
</head>
<body>
<main class="home">
<header>
  <h1>forge-bot</h1>
  <dl>
    <div><dt>Version</dt><dd>{version}</dd></div>
    <div><dt>Mention trigger</dt><dd><code>{mention}</code></dd></div>
    <div><dt>Forges</dt><dd>{forges}</dd></div>
    <div><dt>Agents</dt><dd>{agents}</dd></div>
  </dl>
</header>
<nav aria-labelledby="pages">
  <h2 id="pages">Pages</h2>
  <ul>{links}</ul>
</nav>
</main>
</body>
</html>
