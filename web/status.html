<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="15">
<title>forge-bot — thread status</title>

<link rel="stylesheet" href="/dashboard.css">
</head>
<body>
<main>
<nav class="sections" aria-label="Main navigation">
  <a href="/">forge-bot</a>
  <a href="/status" aria-current="page">Status</a>
  <a href="/statistics">Statistics</a>
  <a href="/admin">Admin</a>
  <a href="/notifications">Notifications</a>
</nav>

<h1>forge-bot — thread status</h1>
<form class="search" method="get" action="/status">
<input type="search" name="q" value="{query}" placeholder="owner/repo/pulls/123#issuecomment-456" aria-label="Search by comment URL">
<button type="submit">Search</button>
{clear}
</form>
<p class="sub">{summary} Refreshes every 15s.</p>
<div id="status-threads" class="table-scroll">
<table>
<thead><tr><th>State</th><th>Thread</th><th>Worker</th><th>Agent</th><th>Model</th><th>Effort</th><th>Cache</th><th>Queued</th><th>Runs</th><th>Updated</th><th>Last result</th><th>Details</th></tr></thead>
<tbody>
{rows}
</tbody>
</table>
</div>
</main>
<script>{table_scroll_script}</script>
</body>
</html>
