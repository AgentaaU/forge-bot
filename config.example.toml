# Example configuration for forge-bot.
#
# forge-bot runs as a root-controlled system service (see
# `contrib/install-system.sh`) and executes every agent as the `[users.*]`
# account it is addressed as. Absolute paths such as `/var/lib/forge-bot` keep
# checkouts and state persistent.
#
# Copy to `forge-bot.toml` and adjust. Secrets can be supplied through the
# environment instead of this file:
#
#   FORGEJO_WEBHOOK_SECRET, FORGEJO_TOKEN, FORGEJO_BASE_URL,
#   FORGEJO_BOT_USERNAME, FORGE_BOT_BIND, FORGE_BOT_MENTION,
#   FORGE_BOT_MAX_CONCURRENCY,
#   FORGE_BOT_WORKSPACE_ROOT, FORGE_BOT_SESSION_DIR

# Bind locally by default; use `0.0.0.0:8080` (or a specific address) if
# Forgejo must deliver webhooks from another host.
bind = "127.0.0.1:8080"
mention = "@agent"
# Ordered agents for unqualified mentions and capacity fallback. When omitted,
# the built-in order starts with codex. Use adapter names (`agy` for
# Antigravity, `claude` for Claude Code).
# Only listed agents are tried as fallbacks; use @agent --agent=<name> to select one.
agent_sequence = ["codex", "agy", "pi-rpc", "claude"]

[forgejo]
base_url = "http://forgejo.example.com:3000"
# Public web URL used for user-facing links (issue/PR links on the status page)
# when it differs from `base_url`, for example when API traffic goes over
# loopback. Defaults to `base_url`.
# web_url = "https://forgejo.example.com"
# webhook_secret = "change-me"
# token = "change-me"
bot_username = "forge-bot"

# --- explicit multi-user mode (optional) ------------------------------------
#
# Every run belongs to a configured `[users.*]` account; at least one table is
# required. Each user is a real Forgejo account addressed by its own login
# (`@user_id` for a non-default user; the default user logs in as
# `forgejo.bot_username`) and runs as a separate, non-root Linux account.
#
# Exactly one user must have `role = "default"`. A user may pin an adapter
# with `agent` and a model with `agent_model`; the model is passed to the
# spawned agent (`--model <id>`) unless the adapter's configured args already
# set one.
#
# Each user should set its own `token`. The default user falls back to the
# global `[forgejo] token`; a non-default user without a token gets none, so a
# `@reviewer` run never replies as the default bot. Workspaces, sessions and
# backend conversations are namespaced by `user_id`, so users never share a
# checkout or a conversation.
#
# [users.forge-bot]
# role = "default"
# host_user = "agent"
# token = "change-me-default"
#
# [users.forge-reviewer]
# role = "reviewer"
# host_user = "forge-reviewer"
# token = "change-me-reviewer"
# agent = "codex"
# agent_model = "gpt-fast"

# --- process execution / account isolation -----------------------------------
#
# Every run is forked natively, moved into a per-run cgroup v2 and dropped to
# its `[users.*].host_user` before `exec`, so agent and repository work never
# runs as the gateway. No external `systemd-run` or `systemctl` executable is
# involved.
#
# Secrets are passed in the child's environment (never on a command line).
# Cancelling a run writes `cgroup.kill`, stopping the whole run cgroup.
#
# [executor]
# Root of the cgroup v2 hierarchy the gateway creates per user/run. The
# gateway must be able to create directories here.
# cgroup_root = "/sys/fs/cgroup/forge-bot"
# passwd_file = "/etc/passwd"

[policy]
# `allow_all = true` disables authorization entirely. Use only for local
# testing.
allow_all = false
# A user is allowed when it appears here; an empty list means "any user".
allowed_users = ["admin"]
# A repository is allowed when it appears here; an empty list means "any repo".
# At least one of the two lists must be non-empty unless `allow_all` is set.
allowed_repos = ["org/repo"]

[workspace]
# Clone the repository before invoking an agent.
enabled = true
# `~` expands to the service account's home for a run without a `host_user`.
# Explicit `[users.*]` runs ignore this and check out directly in the
# `host_user`'s home, which that account already owns.
root = "~/.local/state/forge-bot/workspaces"
reuse = true
git_author_name = "forge-bot"
git_author_email = "forge-bot@localhost"

[reply]
# Post "on it" when a job is accepted. Capacity fallbacks edit the same
# comment instead of posting one comment per step.
ack = true
# Post the result when a job finishes. Enable if agents do not reply themselves.
result = false

[capacity]
# When an agent fails, retry the job on the next available agent instead of
# leaving the thread unanswered. An agent whose output looks like a quota,
# rate-limit or capacity/overload error is additionally marked unavailable for
# the retry interval reported by the agent, or `cooldown_secs` if the response
# has no usable interval. The requested (or default) agent is still tried first
# while it is cooling down, so a recovered quota is picked up; a successful run
# clears the mark. A start failure uses the configured cooldown; an ordinary
# non-capacity run failure does not disable the agent. When no agent is left,
# the bot replies "No available agent". `[quota]` is accepted as an alias.
#
fallback = true
# Fallback window for messages without a usable retry interval (five hours).
cooldown_secs = 18000
# Extra, case-insensitive phrases that count as a capacity message, in
# addition to the built-in markers ("usage limit", "rate limit", "too many
# requests", "quota exceeded", "overloaded", "at capacity", "503 Service
# Unavailable", ...).
markers = []

[session]
# `~` expands to the service account's home. Use an absolute path such as
# `/var/lib/forge-bot/state` for a system-wide install.
dir = "~/.local/state/forge-bot/state"
# How many agent runs may be in flight at once, shared by every adapter:
# one-shot (codex/pi/claude/...) and pooled (pi-rpc) alike. This is the single
# total count of agents; there is no separate per-adapter or pool limit. A
# worker slot is held for the whole job (workspace preparation, agent run and
# reply), so this also bounds concurrent checkouts. Because one conversation
# runs at most one agent at a time, this is also how many different
# conversations may run in parallel; a busy thread's follow-up mentions queue
# in order instead of taking another slot. This bounds the host and provider
# load regardless of how many conversations are queued.
workers = 16
queue_capacity = 256
recover = true
# How long an idle thread keeps its status and run history. A thread untouched
# for longer is evicted from memory and disk, which bounds the memory a bot
# that runs for a long time uses. A thread with a run in flight or a mention
# waiting is never evicted. `0` disables eviction and keeps every thread.
retention_secs = 604800

# --- agents -----------------------------------------------------------------
#
# Each adapter has sensible defaults; any field can be overridden. A custom
# adapter only needs a `command`.
#
# `timeout_secs = 0` disables the wall-clock limit, so an agent is allowed to
# run to completion instead of being killed when a timer expires.
#
# Agents run with auto-approve (issue #33): codex always bypasses its
# sandbox; agy and claude get `--dangerously-skip-permissions`, and pi gets
# `--approve` by default. Set `dangerously_skip_permissions = false` on
# agy/claude/pi to opt out.
#
# `output_format = "json"` tells an adapter to parse one JSON result object
# (reply + prompt-cache usage) instead of plain text. `agy` and `claude`
# enable it themselves; set it for a custom adapter whose CLI emits a JSON
# result, and add the CLI's own machine-readable flag to `args`.

[agents.codex]
timeout_secs = 0

[agents.agy]
command = "agy"
args = ["--print"]
timeout_secs = 0

[agents.pi]
command = "pi"
args = ["--print", "--mode", "text"]
timeout_secs = 0

[agents.claude]
command = "claude"
args = ["--print"]
timeout_secs = 0

# [agents.kimi]
# command = "kimi"
# args = ["--print"]
# A Kimi CLI that emits a JSON result can report prompt-cache usage:
# args = ["--print", "--output-format", "json"]
# output_format = "json"

# A completely custom adapter:
# [agents.my-agent]
# command = "my-agent"
# args = ["--non-interactive"]
# prompt = "stdin" # or "arg"
# timeout_secs = 0
# [agents.my-agent.env]
# MY_AGENT_FLAG = "1"

# --- long-lived Pi RPC agent pool -------------------------------------------
#
# The `pi-rpc` adapter keeps `pi --mode rpc` processes alive and reuses an idle
# agent for the same workspace, spawning a new one when all are busy. It is the
# default Pi backend; the one-shot `pi` adapter is kept but disabled unless
# enabled with `[agents.pi] enabled = true`. The pool has no size limit of its
# own: `[session] workers` is the single total count and caps live agents too.
[pi_rpc]
command = "pi"
idle_ttl_secs = 900
# Wall-clock limit for a single request. 0 disables the limit so an agent
# runs to completion instead of being killed when a timer expires.
timeout_secs = 0
approve = true
# Persist the backend session (deterministic `--session-id`) so an evicted or
# restarted process resumes the same conversation instead of cold-starting.
no_session = false
# A same-thread follow-up mention is delivered into the live `pi` process with
# pi's `steer` command: it is merged into the current run instead of waiting
# for that run to settle and becoming the next turn, and it can unblock a run
# that would otherwise never settle. One-shot CLIs (codex, agy, claude, kimi)
# have no live stdin channel, so their follow-ups are still queued and run as a
# separate next turn.
# Keep one session per conversation. When true (default) an idle process may
# serve a different conversation in the same workspace, but the pool first
# points it at that conversation's own session: it switches back to the session
# file the conversation used earlier or starts a fresh session (`new_session`)
# for a brand-new thread. A new thread therefore never inherits the previous
# thread's context. Set to false to reuse idle processes across conversations
# in the workspace and carry their earlier session.
session_per_conversation = true
# args = []

# --- polling ingester -------------------------------------------------------
#
# Webhook delivery is the default/recommended trigger. Enable the poller only
# when the bot account cannot create a hook; it consumes the same pipeline and
# discovers mentions through the issue-comments API instead.
[poller]
enabled = false
interval_secs = 15
# Empty = every repository visible to the token. The list is refreshed every
# discover_interval_secs, so newly created repositories are picked up
# automatically. Set an explicit ["owner/repo", ...] list to restrict polling.
repositories = []
discover_interval_secs = 300
lookback_secs = 3600
page_limit = 50
